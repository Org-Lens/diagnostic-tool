<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI组织适配度自测表 - OrgLens</title>
<meta name="description" content="5个维度，3分钟，评估你的组织是否为AI时代做好了准备。基于OrgLens组织透镜方法论设计。">
<meta property="og:title" content="AI组织适配度自测表 - OrgLens">
<meta property="og:description" content="5个维度，3分钟，评估你的组织是否为AI时代做好了准备。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231a1a2e'/><circle cx='16' cy='16' r='10' fill='none' stroke='%232d6a4f' stroke-width='1.5'/><line x1='5' y1='27' x2='27' y2='5' stroke='%23c8a96e' stroke-width='1.5' opacity='0.6'/><circle cx='16' cy='16' r='3' fill='%232d6a4f'/></svg>">
<style>
:root{
--primary:#1a1a2e;--accent:#2d6a4f;--accent-light:#e8f5e9;--gold:#c8a96e;--gold-light:#f7efe0;
--bg:#f6f7f6;--card-bg:#ffffff;--border:#e0e0e0;--high:#2d6a4f;--mid:#e6a817;--low:#c0392b;
--text2:#666;--text3:#999
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
background:var(--bg);color:var(--primary);line-height:1.6;-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent
}
.container{max-width:720px;margin:0 auto;padding:0 20px 80px}
.header{text-align:center;padding:32px 0 22px;border-bottom:1px solid var(--border);margin-bottom:24px}
.header h1{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:.5px;line-height:1.3}
.header .subtitle{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5}
.framework-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--accent);background:var(--accent-light);padding:5px 16px;border-radius:20px;font-weight:600}
.framework-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.instructions{background:var(--card-bg);border-radius:12px;padding:20px 22px;margin-bottom:22px;border:1px solid var(--border)}
.instructions h3{font-size:14px;margin-bottom:8px;color:var(--primary);font-weight:700}
.instructions p{font-size:13px;color:var(--text2);margin:3px 0;line-height:1.6}
.scale-badge{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.scale-badge span{display:inline-block;font-size:11px;padding:3px 10px;background:#f0f0f0;border-radius:12px;color:var(--text2)}
.dim-card{background:var(--card-bg);border-radius:12px;padding:22px 20px;margin-bottom:18px;border:1px solid var(--border);transition:box-shadow .2s}
.dim-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.05)}
.dim-header{border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
.dim-header .dim-num{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:6px}
.dim-header h2{font-size:17px;font-weight:700;margin:3px 0 2px;color:var(--primary)}
.dim-header .dim-desc{font-size:12px;color:var(--text2)}
.question{padding:12px 0;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px}
.question:last-child{border-bottom:none}
.q-num{width:26px;height:26px;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-text{flex:1;font-size:13.5px;color:#333;line-height:1.5}
.q-options{display:flex;gap:5px;flex-shrink:0}
.q-options button{width:36px;height:36px;border-radius:50%;border:2px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .15s;outline:none}
.q-options button:hover{border-color:var(--accent);color:var(--accent)}
.q-options button:active{transform:scale(.92)}
.q-options button.selected.low{background:var(--low);border-color:var(--low);color:#fff;transform:scale(1.05)}
.q-options button.selected.mid{background:var(--gold);border-color:var(--gold);color:#fff;transform:scale(1.05)}
.q-options button.selected.high{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.05)}
.dim-subtotal{margin-top:10px;padding:10px 14px;background:#f8faf8;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px}
.dim-subtotal .score-box{width:44px;height:44px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;transition:all .3s}
.dim-subtotal .score-box.low-bg{background:var(--low)}
.dim-subtotal .score-box.mid-bg{background:var(--gold)}
.dim-subtotal .label{color:var(--text2)}
.dim-subtotal .label strong{color:var(--primary)}
.dim-subtotal .label .outof{color:var(--text3);font-size:11px}
.btn-row{display:flex;gap:10px;justify-content:center;margin:24px 0}
.btn{padding:11px 26px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;outline:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1b5e3b}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-outline{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.results-card{background:var(--card-bg);border-radius:12px;padding:22px 20px;margin-bottom:18px;border:1px solid var(--border);animation:fadeInUp .4s ease-out}
.results-card h2{font-size:19px;font-weight:700;margin-bottom:14px;text-align:center}
.result-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13.5px}
.result-row:last-child{border-bottom:none}
.result-row .r-name{flex:1;font-weight:600}
.result-row .r-score{width:80px;text-align:center;font-weight:700;color:var(--accent)}
.result-row .r-level{width:90px;text-align:center;font-size:12px}
.result-row .r-level .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:600}
.tag-good{background:var(--accent-light);color:var(--high)}
.tag-ok{background:var(--gold-light);color:#b8860b}
.tag-bad{background:#fce4ec;color:var(--low)}
.result-total{display:flex;align-items:center;padding:14px 0;background:#f8faf8;border-radius:10px;margin-top:8px;font-size:14px;font-weight:700;justify-content:center;gap:10px}
.result-total .big-score{font-size:34px;font-weight:800;color:var(--accent)}
.result-bar{width:100%;height:8px;background:#eee;border-radius:4px;margin:8px 0;overflow:hidden}
.result-bar .fill{height:100%;border-radius:4px;transition:width .6s ease-out}
.fill-good{background:linear-gradient(90deg,var(--accent),#4caf50)}
.fill-ok{background:var(--gold)}
.fill-bad{background:var(--low)}
.diagnosis{background:var(--card-bg);border-radius:12px;padding:22px 20px;margin-bottom:18px;border:2px solid var(--accent);text-align:center;animation:fadeInUp .4s ease-out}
.diagnosis .emoji{font-size:40px;margin-bottom:8px}
.diagnosis h3{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:8px}
.diagnosis .diag-text{font-size:13.5px;color:var(--text2);line-height:1.7;text-align:left;margin:0 auto;max-width:520px}
.diagnosis .diag-text p{margin:6px 0}
.action-card{background:var(--gold-light);border-radius:12px;padding:18px 20px;margin-bottom:18px;border:1px solid var(--gold);animation:fadeInUp .4s ease-out}
.action-card h3{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.action-card ul{list-style:none;font-size:13px;color:var(--text2);line-height:1.8}
.action-card ul li:before{content:"→ ";color:var(--gold);font-weight:700}
.print-btns{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.footer{text-align:center;padding:32px 0 20px;border-top:1px solid var(--border);margin-top:24px}
.footer-logo{width:160px;margin-bottom:6px;opacity:.85}
.footer-tagline{font-size:12px;color:var(--text3)}
.dim-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dim-legend span{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600}
.legend-good{background:var(--accent-light);color:var(--high)}
.legend-ok{background:var(--gold-light);color:#b8860b}
.legend-bad{background:#fce4ec;color:var(--low)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:500px){
.container{padding:0 14px 60px}
.header h1{font-size:20px}
.dim-card{padding:16px 14px}
.question{gap:8px}
.q-options button{width:32px;height:32px;font-size:12px}
}
</style>
</head>
<body>
<div class="container" id="app">

<div class="header">
<h1>AI组织适配度自测表</h1>
<p class="subtitle">5个关键维度 · 评估你的组织是否做好了迎接AI的准备</p>
<div class="framework-badge"><span class="dot"></span>基于OrgLens组织透镜方法论</div>
</div>

<div class="instructions">
<h3>📋 自测说明</h3>
<p>本自测围绕AI引入组织时的5个关键决策点设计。</p>
<p>每道题请根据你公司的<span style="font-weight:700;color:var(--primary)">真实状态</span>（而非"应该怎样"）打分。</p>
<div class="scale-badge">
<span>1分 = 完全没想过/没答案</span>
<span>2分 = 模糊有感觉但说不清</span>
<span>3分 = 能清晰回答有对应方案</span>
</div>
<p style="margin-top:12px;font-size:12px;color:var(--text3)">⏱️ 预计3分钟完成 · 5个维度 · 共5道题</p>
</div>

<div id="questions-area"></div>

<div class="btn-row">
<button class="btn btn-primary" id="submit-btn" disabled onclick="submitAssessment()">查看诊断结果</button>
</div>
<div class="btn-row">
<button class="btn btn-outline" onclick="resetAll()">重新自测</button>
</div>

<div id="results-area"></div>

<div class="footer">
<img src="orglens-logo.png" alt="OrgLens · 看清组织，看见解法" class="footer-logo">
<p class="footer-tagline">OrgLens · 看清组织，看见解法</p>
</div>

</div>

<script>
const dims = [
  {
    id:"impact",
    num:"01",
    title:"冲击定位",
    desc:"AI进来之后，谁的岗位变化最大？",
    question:"AI引入后，你能不能清楚说出：谁的工作内容变化最大，变成了什么？",
    hints:{
      1:"没有梳理过，也不知道谁会受影响",
      2:"大概知道哪些岗位会变，但说不清楚具体变成什么样",
      3:"已经做过岗位影响分析，明确了变化路径和新的工作内容"
    }
  },
  {
    id:"boundary",
    num:"02",
    title:"人机分工",
    desc:"哪些交给AI，哪些留给人？",
    question:"你有没有画出一条清晰的\"人机分工线\"——哪些事交给AI做，哪些必须人来做？",
    hints:{
      1:"没想过这个问题，先用了再说",
      2:"有一些直觉判断，但没有正式的决策标准或清单",
      3:"已经系统定义了人机分工的原则和具体场景边界"
    }
  },
  {
    id:"governance",
    num:"03",
    title:"治理归属",
    desc:"谁为AI负责？",
    question:"如果AI输出出了错、捅了篓子——有没有一个明确的人或部门为此负责？归哪个部门管，向谁汇报？",
    hints:{
      1:"目前没人专门负责，出问题再说",
      2:"名义上某个部门在管但实际上没人真正owner",
      3:"有明确的AI治理责任人/部门，有汇报线和问责机制"
    }
  },
  {
    id:"performance",
    num:"04",
    title:"考核重构",
    desc:"绩效考核跟得上吗？",
    question:"你的绩效考核体系有没有因为AI的引入而调整？怎么考核\"人+AI\"的组合产出？",
    hints:{
      1:"考核完全没变，还是按原来的指标",
      2:"意识到可能需要改，但还没动手",
      3:"已经调整了考核框架，纳入了人机协作效率等新指标"
    }
  },
  {
    id:"talent",
    num:"05",
    title:"人才重估",
    desc:"谁可能被AI激活？",
    question:"你有没有重新审视团队——找出那些以前被忽略、但现在恰恰最适合跟AI配合的人？",
    hints:{
      1:"没想过这件事，还在按原来的标准评估人",
      2:"隐约觉得有些人会因为AI更突出，但没有系统盘点",
      3:"已经做了人才重新盘点，识别出了AI时代的\"新关键人\""
    }
  }
];

let scores = {};
dims.forEach(d=>{scores[d.id]=0});

function buildQuestions(){
  const area = document.getElementById('questions-area');
  let html = '';
  dims.forEach((dim,i)=>{
    html += '<div class="dim-card">';
    html += '<div class="dim-header">';
    html += '<div class="dim-num"><span class="dim-dot" style="background:var(--gold)"></span>维度'+dim.num+'</div>';
    html += '<h2>'+dim.title+'</h2>';
    html += '<div class="dim-desc">'+dim.desc+'</div>';
    html += '</div>';
    html += '<div class="question">';
    html += '<div class="q-num">'+(i+1)+'</div>';
    html += '<div class="q-text">'+dim.question+'</div>';
    html += '<div class="q-options">';
    html += '<button class="opt-btn" data-dim="'+dim.id+'" data-val="1" onclick="selectScore(this)">1</button>';
    html += '<button class="opt-btn" data-dim="'+dim.id+'" data-val="2" onclick="selectScore(this)">2</button>';
    html += '<button class="opt-btn" data-dim="'+dim.id+'" data-val="3" onclick="selectScore(this)">3</button>';
    html += '</div></div>';
    html += '<div id="sub-'+dim.id+'" class="dim-subtotal" style="display:none">';
    html += '<div class="score-box" id="box-'+dim.id+'">-</div>';
    html += '<div class="label"><strong>'+dim.title+'</strong> <span class="outof">/ 3分</span></div>';
    html += '<div class="dim-legend" id="legend-'+dim.id+'"></div>';
    html += '</div>';
    html += '</div>';
  });
  area.innerHTML = html;
}

function selectScore(btn){
  const dim = btn.dataset.dim;
  const val = parseInt(btn.dataset.val);
  scores[dim]=val;
  const siblings = btn.parentElement.querySelectorAll('.opt-btn');
  siblings.forEach(b=>{
    b.classList.remove('selected','low','mid','high');
    if(parseInt(b.dataset.val)===val){
      b.classList.add('selected');
      if(val===1) b.classList.add('low');
      else if(val===2) b.classList.add('mid');
      else b.classList.add('high');
    }
  });
  const sub = document.getElementById('sub-'+dim);
  sub.style.display='flex';
  const box = document.getElementById('box-'+dim);
  box.textContent = val;
  box.className = 'score-box';
  if(val===1) box.classList.add('low-bg');
  else if(val===2) box.classList.add('mid-bg');

  const dimData = dims.find(d=>d.id===dim);
  const legend = document.getElementById('legend-'+dim);
  legend.innerHTML = '<span class="legend-'+(val===3?'good':val===2?'ok':'bad')+'">'+dimData.hints[val]+'</span>';

  checkComplete();
}

function checkComplete(){
  const allDone = dims.every(d=>scores[d.id]>0);
  document.getElementById('submit-btn').disabled = !allDone;
}

function submitAssessment(){
  const total = dims.reduce((s,d)=>s+scores[d.id],0);
  const max = dims.length*3;
  const pct = Math.round(total/max*100);

  let level,emoji,diagLabel,diagText;
  if(pct>=80){
    level='ready';emoji='🚀';diagLabel='AI就绪型组织';
    diagText='<p>你的组织在AI适配方面已经走在前面。你有清晰的岗位冲击认知、人机分工线、治理归属、考核调整思路，甚至还做了人才重新盘点。</p><p><strong>下一步不是"上不上AI"，而是"怎么让AI和组织融合得更深"</strong>——确保AI的引入不仅是效率提升，更是组织能力的结构性升级。</p>';
  }else if(pct>=53){
    level='progress';emoji='🔧';diagLabel='AI适配中组织';
    diagText='<p>你的组织已经意识到了AI带来的组织变化，但在关键决策上有明显的"模糊地带"。可能某个维度做得好、另一个维度完全空白。</p><p><strong>最大的风险不是AI不好用，而是"部门各自为战"——</strong>技术部只管部署、HR不改考核、管理层不问归属。最终AI跑起来了，组织却跑散了。</p>';
  }else{
    level='risk';emoji='⚠️';diagLabel='AI风险型组织';
    diagText='<p>你的组织目前基本是"先把AI用起来再说"的状态。这在AI引入初期是常见的，但如果持续超过一个季度——AI的效率红利会被组织的内耗完全吃掉。</p><p><strong>你需要的不是更快地上AI，而是更早地重新设计组织。</strong>一个为纯人时代设计的组织架构，在人机混合时代会自己把自己卡死。</p>';
  }

  const levelColors = {'ready':'good','progress':'ok','risk':'bad'};
  const lc = levelColors[level];

  let html = '<div style="text-align:center;margin-top:8px"><h2 style="font-size:18px;font-weight:700;margin-bottom:6px">📊 诊断结果</h2></div>';

  html += '<div class="diagnosis">';
  html += '<div class="emoji">'+emoji+'</div>';
  html += '<h3>'+diagLabel+'</h3>';
  html += '<div class="diag-text">'+diagText+'</div>';
  html += '<div style="margin-top:14px">';
  html += '<div class="result-total"><span>综合得分</span><span class="big-score">'+total+'</span><span>/ '+max+' 分</span></div>';
  html += '<div class="result-bar"><div class="fill fill-'+lc+'" style="width:'+pct+'%"></div></div>';
  html += '<div style="font-size:12px;color:var(--text3);margin-top:4px">适配度 '+pct+'%</div>';
  html += '</div></div>';

  html += '<div class="results-card"><h2>各维度详情</h2>';
  dims.forEach(d=>{
    const v = scores[d.id];
    const lv = v===3?'good':v===2?'ok':'bad';
    const lvl = v===3?'清晰就绪':v===2?'模糊地带':'风险盲区';
    html += '<div class="result-row">';
    html += '<div class="r-name">'+d.title+'</div>';
    html += '<div class="r-score">'+v+' / 3</div>';
    html += '<div class="r-level"><span class="tag tag-'+lv+'">'+lvl+'</span></div>';
    html += '</div>';
    html += '<div class="result-bar"><div class="fill fill-'+lv+'" style="width:'+Math.round(v/3*100)+'%"></div></div>';
    html += '<div style="font-size:12px;color:var(--text2);padding:2px 0 8px 0;line-height:1.5">'+d.hints[v]+'</div>';
  });
  html += '</div>';

  html += '<div class="action-card"><h3>💡 下一步行动建议</h3><ul>';
  if(pct>=80){
    html += '<li>每月做一次"AI组织适配度回顾"，因为AI能力每个月都在变</li>';
    html += '<li>开始关注"AI放大系数"指标——Token消耗产出比、人机协作效率</li>';
    html += '<li>考虑设立"AI运营"角色，向COO或CEO汇报，而非放在CTO下面</li>';
  }else if(pct>=53){
    html += '<li>优先补得分最低的维度——一个短板可以拖垮全局</li>';
    html += '<li>组织一次跨部门AI对齐会，把"人机分工线"画出来</li>';
    html += '<li>指定一个AI治理责任人——不需要全职，但必须有人owner</li>';
  }else{
    html += '<li>先停下来：在组织框架调整之前，不要再上新的AI工具</li>';
    html += '<li>做一次全员岗位影响分析：AI进来后，每个岗位变成什么</li>';
    html += '<li>最少做到一件事——明确"如果AI出错了，谁负责"</li>';
  }
  html += '</ul></div>';

  html += '<div class="print-btns">';
  html += '<button class="btn btn-primary" onclick="copyResult()">📋 复制结果</button>';
  html += '<button class="btn btn-outline" onclick="window.print()">🖨️ 打印报告</button>';
  html += '</div>';

  document.getElementById('results-area').innerHTML = html;
  document.getElementById('results-area').scrollIntoView({behavior:'smooth'});

  window._resultText = 'OrgLens AI组织适配度自测结果\n\n综合得分: '+total+'/'+max+' ('+pct+'%) - '+diagLabel+'\n\n';
  dims.forEach(d=>{
    const v=scores[d.id];
    const lvl=v===3?'清晰就绪':v===2?'模糊地带':'风险盲区';
    window._resultText += d.title+': '+v+'/3 - '+lvl+'\n  '+d.hints[v]+'\n\n';
  });
}

function copyResult(){
  if(!window._resultText){alert('请先完成诊断');return;}
  navigator.clipboard.writeText(window._resultText).then(()=>{
    alert('✅ 结果已复制到剪贴板');
  }).catch(()=>{
    alert('复制失败，请手动截图保存');
  });
}

function resetAll(){
  scores={};
  dims.forEach(d=>{scores[d.id]=0});
  buildQuestions();
  document.getElementById('results-area').innerHTML='';
  document.getElementById('submit-btn').disabled=true;
  window.scrollTo({top:0,behavior:'smooth'});
  window._resultText=null;
}

buildQuestions();
</script>
</body>
</html>
